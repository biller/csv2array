name: Run tests

on: push

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: Install PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.4

    - uses: actions/checkout@v7

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-suggest

    - name: Run tests
      run: vendor/bin/phpunit --testdox tests
